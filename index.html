<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Life Dashboard</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- ===== HEADER: Greeting + Clock ===== -->
    <header class="header">
      <div class="clock-wrapper">
        <div id="clock" class="clock">00:00:00</div>
        <div id="date" class="date"></div>
      </div>

      <div class="header-right">
        <div id="greeting" class="greeting"></div>

        <!-- ── Feature 2: Custom Name ── -->
        <div class="name-row">
          <span id="name-display" class="name-display"></span>
          <button id="name-edit-btn" class="btn-inline" title="Change name">
            ✏️
          </button>
        </div>

        <!-- ── Feature 1: Dark / Light toggle ── -->
        <button
          id="theme-toggle"
          class="theme-btn"
          aria-label="Toggle light/dark mode"
        >
          <span id="theme-icon">🌙</span>
          <span id="theme-label">Dark</span>
        </button>
      </div>
    </header>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="dashboard">
      <!-- TO-DO LIST -->
      <section class="card" id="todo-section">
        <h2 class="card-title">📝 To-Do List</h2>

        <div class="todo-input-row">
          <input
            type="text"
            id="todo-input"
            class="todo-input"
            placeholder="Add a new task..."
            maxlength="120"
          />
          <button id="todo-add-btn" class="btn btn-primary">Add</button>
        </div>

        <ul id="todo-list" class="todo-list"></ul>

        <div class="todo-footer">
          <span id="todo-count" class="todo-count"></span>
          <button id="clear-done-btn" class="btn btn-ghost">Clear done</button>
        </div>
      </section>

      <!-- RIGHT COLUMN -->
      <div class="right-column">
        <!-- FOCUS TIMER -->
        <section class="card" id="timer-section">
          <h2 class="card-title">⏱ Focus Timer</h2>

          <!-- ── Feature 3: Custom Pomodoro duration ── -->
          <div class="timer-duration-row">
            <label for="timer-duration-input" class="duration-label"
              >Minutes:</label
            >
            <input
              type="number"
              id="timer-duration-input"
              class="duration-input"
              min="1"
              max="120"
              value="25"
            />
            <button id="timer-set-btn" class="btn btn-ghost btn-sm">Set</button>
          </div>

          <div class="timer-display-wrapper">
            <svg class="timer-ring" viewBox="0 0 120 120">
              <circle class="timer-ring-bg" cx="60" cy="60" r="52" />
              <circle
                class="timer-ring-fill"
                cx="60"
                cy="60"
                r="52"
                id="timer-ring-fill"
              />
            </svg>
            <div id="timer-display" class="timer-display">25:00</div>
          </div>

          <div class="timer-label-row">
            <span id="timer-session-label" class="timer-session-label"
              >Ready</span
            >
          </div>

          <div class="timer-controls">
            <button id="timer-start-btn" class="btn btn-primary">Start</button>
            <button id="timer-stop-btn" class="btn btn-secondary" disabled>
              Stop
            </button>
            <button id="timer-reset-btn" class="btn btn-ghost">Reset</button>
          </div>
        </section>

        <!-- QUICK LINKS -->
        <section class="card" id="links-section">
          <h2 class="card-title">🔗 Quick Links</h2>

          <div class="links-add-row">
            <input
              type="text"
              id="link-name-input"
              class="link-input"
              placeholder="Name"
              maxlength="30"
            />
            <input
              type="url"
              id="link-url-input"
              class="link-input"
              placeholder="https://..."
              maxlength="200"
            />
            <button id="link-add-btn" class="btn btn-primary">Add</button>
          </div>

          <div id="links-grid" class="links-grid"></div>
        </section>
      </div>
      <!-- /.right-column -->
    </main>

    <!-- Edit Task Modal -->
    <div id="edit-modal" class="modal-overlay hidden">
      <div class="modal">
        <h3>Edit Task</h3>
        <input type="text" id="edit-input" class="todo-input" maxlength="120" />
        <div class="modal-actions">
          <button id="edit-save-btn" class="btn btn-primary">Save</button>
          <button id="edit-cancel-btn" class="btn btn-ghost">Cancel</button>
        </div>
      </div>
    </div>

    <!-- Name Edit Modal -->
    <div id="name-modal" class="modal-overlay hidden">
      <div class="modal">
        <h3>What's your name?</h3>
        <input
          type="text"
          id="name-input"
          class="todo-input"
          placeholder="Enter your name..."
          maxlength="40"
        />
        <div class="modal-actions">
          <button id="name-save-btn" class="btn btn-primary">Save</button>
          <button id="name-cancel-btn" class="btn btn-ghost">Cancel</button>
        </div>
      </div>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
